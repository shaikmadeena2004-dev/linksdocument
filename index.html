<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <fieldset>
    <legend>Personal Details</legend>

    
    <label>Name:</label>
    <input type="name" required>
    <br> 
   </br>
   <label>Surname:</label>
    <input type="surname" required>
    <br> 
   </br>
   
   <label>Email:</label>
<input type="email" name="user_email"
       autocomplete="new-password"
       required>
       <br></br>
   <label>MobileNumber:</label>
   <input type="mobilenumber"required id=""Number>
   <br> 
   </br>
   <label>Password:</label>
   <input type="password"required id=""Password>
   <br> 
   </br>
   <label>ConfirmPassword:</label>
   <input type="confirmpassword"required id=""Password>
   <br> 
</br>
   <label>Date of Birth:</label>
   <input type="text"placeholder="dd-mm-yyyy">
   <br> 
   </br>
   <label for="">Gender:</label>
   
<label for="male">Male</label>
<input type="radio" id="male" name="gender">

<label for="female">FeMale</label>
<input type="radio" id="female"name="gender">

<label for="other">others</label>
<input type="radio" id="others"name="gender">
<br>
</br>
<label for="country">Select Country:</label>      
<input type="text" list="countries">
<datalist id="countries">
    <option value="India">
    <option value="USA">
    <option value="UK">
    <option value="Australia">
    <option value="Canada">
</datalist>      
   </option> 
   <br>
   </br>
<label for="year">year of graduation</label>
<input id="year"list="years">
<datalist id="years">   
    <option value="2025">
    <option value="2026">
    <option value="2027">
    <option value="2028">
</datalist>
<br>
</br>
   <label>Upload Picture:</label>
    <input type="file">
    <br><br>

    <input type="reset">
 </fieldset>
 <fieldset>
    <legend>Cource Details</legend>
    <label for="cource">Select Cource:</label>      
<input type="text" list="cource">
<datalist id="cource">
    <option value="python">
    <option value="html">
    <option value="css">
    <option value="java">
    
</datalist>      
   </option> 
   <br>
   </br>


   <lable for="">Delivery Mode:</lable>
   
   
<label for="Online">Online</label>
<input type="radio" id="male" name="Delivery Mode">

<label for="Offline">Offline</label>
<input type="radio" id="female"name="Delivery Mode">
<br>
</br>
     <label>Comments:</label>
<br>
<textarea rows="5" cols="50"></textarea>
<br><br>
     
      </fieldset>
 
   </body>
</html>
